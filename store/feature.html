<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feature Graphic</title>
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body { font-family: "Segoe UI", Roboto, system-ui, sans-serif; color: #fff; position: relative; }
  body.photos { background: linear-gradient(120deg, #4fa0ff 0%, #0262d6 55%, #01204a 100%); }
  body.videos { background: linear-gradient(120deg, #5a5cff 0%, #1b2f8f 55%, #070b26 100%); }
  .text { position: absolute; left: 70px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
  .text img { width: 110px; height: 110px; margin-bottom: 26px; }
  h1 { font-size: 66px; margin: 0; font-weight: 800; letter-spacing: -0.02em; }
  p { font-size: 28px; margin: 12px 0 0; opacity: .9; }
  .phone { position: absolute; right: 70px; top: 50px; width: 300px; transform: rotate(8deg); filter: drop-shadow(0 30px 40px rgba(0,0,0,.45)); }
</style>
</head>
<body>
<script>
  var q = new URLSearchParams(location.search);
  var app = q.get("app");
  document.body.className = app;
  document.body.innerHTML =
    '<div class="text"><img src="../assets/icon-' + app + '.svg" alt=""><h1>' + q.get("h") + "</h1><p>" + q.get("p") + "</p></div>" +
    '<img class="phone" src="../assets/mock-' + app + '.svg" alt="">';
</script>
</body>
</html>
